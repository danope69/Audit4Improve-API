name: pipeline de prueba

on:
  push:
    branches: ["desarrollo"]

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Dar permisos al gradle wrapper
        run: chmod +x ./gradlew

      - name: Construir código
        run: ./gradlew build

      - name: Subir informes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-test-fallidos
          path: app/build/reports/tests/
          retention-days: 5

  generate-javadoc:

    needs: build-and-test

    runs-on: ubuntu-latest

    steps:

      - name: Descargar código
        uses: actions/checkout@v4

      - name: genera javadoc
        run: ./gradlew javadoc

      - name: guarda javadoc como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: javadoc
          path: app/build/docs/javadoc/
          retention-days: 5

  send-email:

    needs: generate-javadoc

    runs-on: ubuntu-latest

    steps:
      - name: envia email
        uses: dawidd6/action-send-mail@v4
        with:
          server_adress: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.email_username }}
          password: ${{ secrets.email_password }}
          to: danope49@gmail.com
          from: "GitHub Actions <no-reply@ejemplo.com>"
          subject: "Pipeline exitoso"
          body: |
            Hola! El pipeline ha tenido éxito.