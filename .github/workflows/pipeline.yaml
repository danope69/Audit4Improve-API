name: pipeline de prueba

on:
  push:
    branches: ["desarrollo"]

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar código
        run: actions/checkout@v4

      - name: Configurar Java
        run: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Dar permisos al gradle wrapper
        run: chmod +x ./gradlew

      - name: Construir código
        run: ./gradlew build

      -name: Subir informes
        if failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-test-fallidos
          path: build/reports/tests/
          retention-days: 5

      - name: Testear el código
        run: ./gradlew test
      
      -name: Subir informes
        if failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-test-fallidos
          path: build/reports/tests/
          retention-days: 5